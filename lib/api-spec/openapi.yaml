openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Fake News & Clickbait Detection API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: News analysis operations
  - name: feedback
    description: User feedback and learning
  - name: stats
    description: Statistics and history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyze:
    post:
      operationId: analyzeNews
      tags: [analysis]
      summary: Analyze news for clickbait
      description: Submits a news headline and/or body for ML analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: ML service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit labeled feedback for learning
      description: User provides the correct label for an analysis to improve the model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /history:
    get:
      operationId: getHistory
      tags: [stats]
      summary: Get recent analysis history
      description: Returns the most recent analyses
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Number of records to return
      responses:
        "200":
          description: History list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryItem"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get aggregate statistics
      description: Returns counts and distributions of past analyses
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /ml-status:
    get:
      operationId: getMlStatus
      tags: [analysis]
      summary: Get ML service status and model info
      description: Returns whether the ML service is ready and which model is loaded
      responses:
        "200":
          description: ML status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlStatus"

  /retrain:
    post:
      operationId: triggerRetrain
      tags: [analysis]
      summary: Manually trigger an immediate model retrain
      description: >-
        Normally runs automatically every few hours. Triggers it immediately
        so newly accumulated Gemini-labeled examples and user feedback are
        folded into the local model without waiting for the schedule.
      responses:
        "200":
          description: Updated ML status after retraining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    NewsInput:
      type: object
      required:
        - headline
      properties:
        headline:
          type: string
          minLength: 3
          description: The news headline to analyze
        body:
          type: ["string", "null"]
          description: Optional full article body text

    AnalysisResult:
      type: object
      required:
        - id
        - headline
        - verdict
        - confidence
        - scores
        - analyzedAt
        - modelUsed
      properties:
        id:
          type: integer
        headline:
          type: string
        body:
          type: ["string", "null"]
        verdict:
          type: string
          enum: [REAL, CLICKBAIT, UNCERTAIN]
          description: Final verdict. UNCERTAIN means there wasn't enough evidence to confidently call it REAL or CLICKBAIT.
        confidence:
          type: number
          description: Confidence score 0-100 for the verdict
        scores:
          $ref: "#/components/schemas/ScoreBreakdown"
        analyzedAt:
          type: string
          description: ISO timestamp
        modelUsed:
          type: string
        indicators:
          type: array
          items:
            type: string
          description: Text indicators that influenced the verdict
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/KeywordMatch"
          description: Clickbait signals found in the text with per-keyword severity scores
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
          description: Real articles or fact-checks found while verifying this claim, if any
        styleAnalysis:
          $ref: "#/components/schemas/StyleAnalysis"
          description: >
            Tier 1 — writing-style verdict from rules + the TF-IDF/structural
            ML model only, independent of whether the claim is factually true.
        factCheck:
          $ref: "#/components/schemas/FactCheckAnalysis"
          description: >
            Tier 2 — real-world corroboration from news search, professional
            fact-checkers, and Wikipedia; never looks at headline phrasing.

    StyleAnalysis:
      type: object
      required:
        - verdict
        - clickbaitScore
        - credibleScore
        - indicators
        - keywords
        - modelUsed
      properties:
        verdict:
          type: string
          enum: [CLICKBAIT_STYLE, NEUTRAL_STYLE, CREDIBLE_STYLE]
        clickbaitScore:
          type: number
          description: 0-100 writing-style clickbait score
        credibleScore:
          type: number
          description: 0-100 writing-style credibility score
        indicators:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/KeywordMatch"
        modelUsed:
          type: string

    FactCheckAnalysis:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: >
            corroborated | partially_corroborated | no_coverage |
            unconfirmed_claim | inconclusive | fact_checked_true |
            fact_checked_false | fact_checked_mixed | wiki_confirmed |
            wiki_contradicted | wiki_related | not_checked
        note:
          type: ["string", "null"]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"

    SourceRef:
      type: object
      required:
        - label
        - title
      properties:
        label:
          type: string
          description: What this source represents, e.g. "Fact-check" or "News coverage"
        title:
          type: string
          description: The article/fact-check title
        url:
          type: ["string", "null"]
          description: Link to the original source
        publisher:
          type: ["string", "null"]
          description: The outlet/publisher name

    ScoreBreakdown:
      type: object
      required:
        - real
        - clickbait
      properties:
        real:
          type: number
          description: Probability score 0-100 for REAL
        clickbait:
          type: number
          description: Probability score 0-100 for CLICKBAIT

    FeedbackInput:
      type: object
      required:
        - analysisId
        - correctLabel
      properties:
        analysisId:
          type: integer
          description: The ID of the analysis being corrected
        correctLabel:
          type: string
          enum: [REAL, CLICKBAIT]
          description: The correct label according to the user

    FeedbackResult:
      type: object
      required:
        - id
        - message
        - totalFeedback
      properties:
        id:
          type: integer
        message:
          type: string
        totalFeedback:
          type: integer
          description: Total number of feedback items collected so far

    HistoryItem:
      type: object
      required:
        - id
        - headline
        - verdict
        - confidence
        - analyzedAt
      properties:
        id:
          type: integer
        headline:
          type: string
        verdict:
          type: string
          enum: [REAL, CLICKBAIT, UNCERTAIN]
        confidence:
          type: number
        analyzedAt:
          type: string
        hasFeedback:
          type: boolean

    Stats:
      type: object
      required:
        - totalAnalyzed
        - verdictCounts
        - avgConfidence
        - totalFeedback
        - accuracyFromFeedback
      properties:
        totalAnalyzed:
          type: integer
        verdictCounts:
          $ref: "#/components/schemas/VerdictCounts"
        avgConfidence:
          type: number
        totalFeedback:
          type: integer
        accuracyFromFeedback:
          type: ["number", "null"]
          description: Model accuracy estimated from user feedback (null if not enough data)

    VerdictCounts:
      type: object
      required:
        - REAL
        - CLICKBAIT
        - UNCERTAIN
      properties:
        REAL:
          type: integer
        CLICKBAIT:
          type: integer
        UNCERTAIN:
          type: integer

    KeywordMatch:
      type: object
      required:
        - word
        - score
      properties:
        word:
          type: string
          description: The exact word or phrase matched in the text
        score:
          type: integer
          description: Severity score 0-100 for this specific keyword signal

    MlStatus:
      type: object
      required:
        - ready
        - modelName
        - feedbackCount
        - lastRetrained
      properties:
        ready:
          type: boolean
        modelName:
          type: string
        feedbackCount:
          type: integer
        lastRetrained:
          type: ["string", "null"]
        geminiExamplesUsed:
          type: integer
          description: Number of Gemini-labeled analyses folded into the local model's training data so far.
        geminiAccuracy:
          type: ["number", "null"]
          description: Local model's accuracy at reproducing Gemini's labels on a held-out test split.
        groqExamplesUsed:
          type: integer
          description: Number of Groq-labeled analyses folded into the local model's training data so far.
        groqAccuracy:
          type: ["number", "null"]
          description: Local model's accuracy at reproducing Groq's labels on a held-out test split.
        teacherExamplesUsed:
          type: integer
          description: Combined number of Gemini + Groq labeled examples folded into the local model's training data.
        teacherAccuracy:
          type: ["number", "null"]
          description: Local model's combined accuracy at reproducing Gemini + Groq labels on a held-out test split; this is what graduation is based on.
        readyForLocalOnly:
          type: boolean
          description: True once the local model has distilled enough Gemini/Groq-labeled examples accurately enough that neither API is needed for new classifications.
