kind = "web"
previewPath = "/"
title = "Fake News Detector"
version = "1.0.0"
id = "artifacts/news-detector"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24098

[services.development]
run = "pnpm --filter @workspace/news-detector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/news-detector", "run", "build" ]
publicDir = "artifacts/news-detector/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24098"
BASE_PATH = "/"
